<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" class="henry-logo-svg">
  <defs>
    <!-- Metallic Chrome Gradients -->
    <linearGradient id="chromeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="chromeDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#64748B" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0A0D14" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Geometric Hex/Shield Bezel -->
  <polygon points="120,12 216,64 216,176 120,228 24,176 24,64" 
           fill="url(#shieldBg)" 
           stroke="url(#chromeLight)" 
           stroke-width="3.5" 
           stroke-linejoin="round" />

  <!-- Inner Recessed Ring with Deep Blue Accent -->
  <polygon points="120,26 202,70 202,170 120,214 38,170 38,70" 
           fill="none" 
           stroke="url(#blueGlow)" 
           stroke-width="1.5" 
           stroke-opacity="0.6" />

  <!-- The Iconic HENRY H Monogram - Modern Aerodynamic Pillars & Wing Bar -->
  <!-- Left Pillar -->
  <path d="M68 62 L88 52 L88 188 L68 178 Z" 
        fill="url(#chromeLight)" />
  <path d="M78 60 L88 52 L88 188 L78 183 Z" 
        fill="url(#chromeDark)" opacity="0.4" />

  <!-- Right Pillar -->
  <path d="M152 52 L172 62 L172 178 L152 188 Z" 
        fill="url(#chromeLight)" />
  <path d="M152 52 L162 60 L162 183 L152 188 Z" 
        fill="url(#chromeDark)" opacity="0.4" />

  <!-- Central Dynamic Speed Blade / Cross Wing -->
  <path d="M88 112 L152 112 L162 128 L78 128 Z" 
        fill="url(#chromeDark)" />
  <path d="M88 112 L152 112 L144 122 L96 122 Z" 
        fill="url(#chromeLight)" />

  <!-- Center Diamond Crystal Core -->
  <polygon points="120,104 134,120 120,136 106,120" 
           fill="url(#blueGlow)" 
           filter="url(#glow)" />
  <polygon points="120,109 129,120 120,131 111,120" 
           fill="#FFFFFF" />

  <!-- Subtle Top & Bottom Specular Pointers -->
  <polygon points="120,34 124,42 116,42" fill="#E2E8F0" />
  <polygon points="120,206 124,198 116,198" fill="#E2E8F0" />
</svg>
